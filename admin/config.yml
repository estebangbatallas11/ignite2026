backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "configuracion"
    label: "Configuración del Sitio"
    files:
      - file: "content/settings.json"
        label: "Textos de la Página"
        name: "settings"
        fields:
          - { label: "Título del Evento", name: "titulo", widget: "string" }
          - { label: "Fecha", name: "fecha", widget: "string" }
          - { label: "Lugar", name: "lugar", widget: "string" }
